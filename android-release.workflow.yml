name: Android release and listing links
on:
  workflow_dispatch:
  push:
    branches: [main, genspark_ai_developer_9_13]
    paths: ['android-src/**', 'build-native.py', '.github/workflows/android-release.yml', 'pages/**']
permissions:
  contents: read
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test marketplace
        run: node --test test-sizes.js test-marketplace.js test-tags.js test-release.js
      - name: Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile native Android app
        run: python3 build-native.py
      - name: Sign when release secrets are configured
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$PASSWORD" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > .local-build/release.jks
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks .local-build/release.jks --ks-key-alias glassmarket-release --ks-pass env:PASSWORD --out apk/GlassMarket9.13.apk apk/GlassMarket9.13-unsigned.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs apk/GlassMarket9.13.apk
            rm .local-build/release.jks
          else
            echo '::notice::Unsigned artifact: sign offline with the new release key. No private key is committed.'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: GlassMarket9.13
          path: apk/GlassMarket9.13*.apk
          retention-days: 30

  # Owner must enable Pages, set ENABLE_PAGES=true, and serve assetlinks.json at
  # https://somontj5.github.io/.well-known/assetlinks.json (domain ROOT, not /server.js/).
  # Workflow/Pages/secret administration is not permitted by this session's GitHub integration.
  links:
    if: github.ref == 'refs/heads/main' && vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - uses: actions/deploy-pages@v4
        id: deploy
