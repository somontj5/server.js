name: Supabase keep-alive and encrypted backup
on:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'
permissions:
  contents: read
concurrency:
  group: gm-supabase-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check configuration
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_SERVICE_KEY" || { echo '::error::Configure SUPABASE_URL and SUPABASE_SERVICE_KEY'; exit 1; }
      - name: Verify schema and private Storage bucket
        run: node supabase-maintenance.js preflight
      - name: Lightweight daily database query
        run: node supabase-maintenance.js ping
      - name: Encrypted consistent backup including private media
        run: node supabase-maintenance.js backup .private-backup/database.gmbak
      - name: Authenticate and verify backup
        run: node supabase-maintenance.js verify-backup .private-backup/database.gmbak
      - uses: actions/upload-artifact@v4
        with:
          name: supabase-encrypted-${{ github.run_id }}
          path: .private-backup/database.gmbak
          # 3 x 64 MB maximum stays below the usual free artifact storage allowance.
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: error
      - name: Remove local backup
        if: always()
        run: rm -rf .private-backup
