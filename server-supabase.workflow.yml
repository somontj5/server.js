name: GlassMarket test server (6h)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'   # автоперезапуск каждые 6 часов
permissions:
  contents: write            # нужно, чтобы записать server-url.txt в репозиторий
concurrency:
  group: gm-server
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then npm install; fi

      - name: Restore DB from previous run
        uses: actions/cache/restore@v4
        with:
          path: data
          key: gm-db-${{ github.run_id }}
          restore-keys: gm-db-

      - name: Start Cloudflare tunnel
        run: |
          curl -sL -o cf.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cf.deb >/dev/null
          nohup cloudflared tunnel --no-autoupdate --url http://localhost:8080 > cf.log 2>&1 &
          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' cf.log | grep -v '^https://api\.' | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then echo "Tunnel URL not found"; cat cf.log; exit 1; fi
          echo "PUBLIC_URL=$URL" >> $GITHUB_ENV
          echo "## Адрес сервера: $URL" >> $GITHUB_STEP_SUMMARY
          echo "Server URL: $URL"

      - name: Run server (~5h50m)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Install this workflow only AFTER successfully running supabase-schema.sql.
          # This is the owner's explicit activation; missing credentials fail closed.
          GM_STORAGE_BACKEND: 'supabase'
          GM_REQUIRE_SUPABASE: 'true'
          GM_SUPABASE_IMPORT: 'true'
          DB_FILE: data/db.json
          VERIFY_TOKEN: ${{ secrets.VERIFY_TOKEN }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          WA_LOGIN_NUMBER: ${{ secrets.WA_LOGIN_NUMBER }}
          WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
          TRUST_CF_PROXY: 'true'
          PUBLIC_URL: ${{ env.PUBLIC_URL }}
        run: |
          set -euo pipefail
          if [ "$GM_STORAGE_BACKEND" = supabase ]; then
            node supabase-maintenance.js preflight data/db.json
          fi
          timeout -k 90s -s TERM 340m node server.js &
          server_pid=$!
          cleanup() { kill -TERM "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT INT TERM
          ready=false
          for i in $(seq 1 180); do
            kill -0 "$server_pid" 2>/dev/null || { echo '::error::Server stopped before readiness'; exit 1; }
            if curl --fail --silent --max-time 5 http://127.0.0.1:8080/health > health.json; then
              if node -e 'const h=require("./health.json");process.exit(h.ok&&h.storage===process.env.GM_STORAGE_BACKEND?0:1)'; then ready=true; break; fi
            fi
            sleep 2
          done
          [ "$ready" = true ] || { echo '::error::Storage readiness failed; new URL was not published'; exit 1; }
          echo "Verified storage backend: $GM_STORAGE_BACKEND"
          # Publish only after schema checks, import/read-back and healthy startup.
          echo "$PUBLIC_URL" > server-url.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add server-url.txt
          git commit -m "server-url: $PUBLIC_URL [skip ci]" || true
          published=false
          for i in 1 2 3; do if git pull --rebase -q && git push -q; then published=true; break; fi; sleep 3; done
          [ "$published" = true ] || { echo '::error::Could not publish server URL'; exit 1; }
          set +e
          wait "$server_pid"
          result=$?
          trap - EXIT INT TERM
          if [ "$result" -ne 0 ] && [ "$result" -ne 124 ]; then exit "$result"; fi

      - name: Save DB for next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: gm-db-${{ github.run_id }}
