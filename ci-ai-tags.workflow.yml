# Optional manual workflow template. The existing server workflow already starts the AI worker.
name: AI tags (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gm-ai-tags-manual
  cancel-in-progress: false
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Process published listings (no DB cache writes)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          AI_LIMIT: '5'
        run: node ai-worker.js
