<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light only">
<title>СтеклоМаркет</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--blue:#00aaff;--blue-d:#0099f7;--green:#02d15c;--green-d:#00b84f;--red:#ff4053;--ink:#000;--ink2:#2f2f2f;--mut:#8f8f8f;--line:#ebebeb;--bg:#fff;--gray:#f2f1f0;--gray2:#f7f7f7;--r:12px}
html,body{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color:var(--ink);font-size:15px;line-height:1.4;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:inherit}
button{background:none;border:0;cursor:pointer}
[hidden]{display:none!important}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.wrap{max-width:720px;margin:0 auto}
/* шапка */
.head{position:sticky;top:0;z-index:30;background:#fff;padding:calc(8px + env(safe-area-inset-top)) 16px 8px}
.head.sh{box-shadow:0 1px 0 var(--line)}
.srow{display:flex;gap:8px;align-items:center}
.sbox{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--gray);border-radius:12px;padding:0 12px;height:44px;color:var(--mut)}
.sbox input{flex:1;border:0;background:transparent;outline:0;font-size:16px;color:var(--ink);min-width:0}
.sbox input::placeholder{color:var(--mut)}
.sbox .clr{color:var(--mut);display:flex}
.ibtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;position:relative;color:var(--ink);flex:0 0 auto}
.ibtn.g{background:var(--gray)}
.ibtn:active{background:#e6e5e3}
.dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--blue);border:2px solid var(--gray)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:-.3px;margin:2px 0 10px}
.brand .lg{width:28px;height:28px;border-radius:8px;background:var(--blue);display:grid;place-items:center}
.brand .lg svg{width:18px;height:18px;stroke:#fff;stroke-width:2.2}
.brand span b{color:var(--blue)}
/* история поиска */
#hist{position:absolute;left:16px;right:16px;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.12);padding:6px 0;max-height:min(320px,45vh);overflow-y:auto;overscroll-behavior:contain}
#q::-webkit-search-cancel-button,#q::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.hrow:active{background:var(--gray2)}.hrow span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hrow .hremove{margin-left:auto;flex:none;padding:6px;color:var(--mut)}
.phonebox{display:flex;align-items:center;gap:10px}.phonebox .prefix{flex:none;border-right:1px solid #ddd;padding-right:10px;color:var(--ink2)}.phonebox input{width:100%;min-width:0;border:0;outline:0;background:transparent;font-size:16px;padding:0}
.hrow{display:flex;align-items:center;gap:12px;width:100%;padding:11px 16px;text-align:left;color:var(--ink2)}
.hrow svg{color:var(--mut);width:20px;height:20px}
.hhead{display:flex;justify-content:space-between;padding:8px 16px 4px;font-size:13px;color:var(--mut)}
.hhead button{color:var(--blue-d);font-size:13px}
/* категории */
.cats{display:grid;grid-template-rows:repeat(2,88px);grid-auto-flow:column;grid-auto-columns:128px;gap:8px;overflow-x:auto;padding:8px 16px 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{position:relative;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;border-radius:12px;background:var(--gray);text-align:left;padding:10px 10px 0;font-size:13px;font-weight:600;line-height:1.2;overflow:hidden;color:var(--ink);white-space:normal}.cat span{display:block;position:relative;z-index:1;max-width:100%}
.cat svg{position:absolute;right:6px;bottom:6px;width:36px;height:36px;stroke-width:1.7;opacity:.95}
.cat.on{box-shadow:inset 0 0 0 2px var(--blue)}
.c-outer{background:#e8f1ff}.c-outer svg{color:#2b6fd6}
.c-dress{background:#ffe9ef}.c-dress svg{color:#d93a6a}
.c-tops{background:#fff1e3}.c-tops svg{color:#e07b1a}
.c-knit{background:#eceaff}.c-knit svg{color:#5b4fd6}
.c-pants{background:#e6f0ff}.c-pants svg{color:#1d4ed8}
.c-suits{background:#eef0f2}.c-suits svg{color:#374151}
.c-sport{background:#e6f7ec}.c-sport svg{color:#1f9d55}
.c-under{background:#fdeaf5}.c-under svg{color:#c026d3}
.c-home{background:#fff6d9}.c-home svg{color:#c48a00}
.c-shoes{background:#ffece6}.c-shoes svg{color:#e0532b}
.c-bags{background:#f3ece6}.c-bags svg{color:#8b5a2b}
.c-acc{background:#e6f7f7}.c-acc svg{color:#0e9488}
.c-other{background:#eef0f2}.c-other svg{color:#5d6b78}
/* фильтр-чипы */
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--gray);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--blue)!important;color:#fff!important;box-shadow:inset 0 0 0 2px var(--blue-d),0 0 0 2px rgba(0,170,255,.35)!important;font-weight:700}
.units .chip.on::before,.chips .chip.on[data-fa]::before{content:"✓";font-weight:800;margin-right:2px}
.seg button.on{box-shadow:inset 0 0 0 2px var(--blue)!important;font-weight:700}
.check.on .bx,.radio.on .rd,.ccell.on .rd{outline:2px solid var(--blue);outline-offset:1px}
.chip svg{width:16px;height:16px}
.sect{display:flex;justify-content:space-between;align-items:baseline;padding:18px 16px 10px}
.sect h2{font-size:22px;font-weight:800;letter-spacing:-.4px}
.sect span{font-size:13px;color:var(--mut)}
/* сетка карточек */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px 10px;padding:0 16px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{cursor:pointer;min-width:0}
.ph{position:relative;aspect-ratio:1/1;border-radius:var(--r);overflow:hidden;background:var(--gray)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.fav{position:absolute;top:6px;right:6px;width:34px;height:34px;display:grid;place-items:center;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.fav.on{color:var(--red)}
.fav.on svg{fill:var(--red);stroke:var(--red)}
.pcount{position:absolute;left:8px;bottom:8px;display:flex;gap:3px}
.pcount i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.6)}
.pcount i:first-child{background:#fff}
.tag{position:absolute;top:8px;left:8px;background:#fff;color:var(--ink);font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;display:flex;align-items:center;gap:3px}
.tag svg{width:12px;height:12px;stroke-width:2.4;color:var(--blue)}
.card .t{font-size:14px;line-height:1.3;margin-top:8px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .p{font-size:16px;font-weight:700;margin-top:3px}
.card .m{font-size:13px;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* пусто */
.empty{text-align:center;padding:48px 24px;color:var(--mut)}
.empty .ill{width:88px;height:88px;border-radius:50%;background:var(--gray);display:grid;place-items:center;margin:0 auto 16px;color:#b5b5b5}
.empty .ill svg{width:40px;height:40px;stroke-width:1.4}
.empty h3{font-size:18px;color:var(--ink);margin-bottom:6px}
.empty p{font-size:14px;margin-bottom:18px}
/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:12px;font-size:16px;font-weight:600;text-decoration:none;color:#fff;transition:background .15s}
.btn svg{width:20px;height:20px}
.b-blue{background:var(--blue)}.b-blue:active{background:var(--blue-d)}
.b-green{background:var(--green)}.b-green:active{background:var(--green-d)}
.b-gray{background:var(--gray);color:var(--ink)}.b-gray:active{background:#e6e5e3}
.b-red{background:#fff0f1;color:var(--red)}
.btn.w{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
/* нижняя навигация */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);display:flex;padding:4px 0 calc(4px + env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:10.5px;color:var(--mut);position:relative}
.nav button.on{color:var(--blue)}
.nav button.on.hf svg{fill:var(--blue)}
.nav .pl{width:40px;height:28px;border-radius:9px;background:var(--blue);display:grid;place-items:center;color:#fff;margin-bottom:-2px}
.nav .pl svg{width:20px;height:20px;stroke-width:2.4}
.nav .nb{position:absolute;top:0;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
main{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
/* верхняя полоса страниц */
.tbar{position:sticky;top:0;z-index:30;background:#fff;display:flex;align-items:center;gap:4px;padding:calc(6px + env(safe-area-inset-top)) 6px 6px}
.tbar .tt{flex:1;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.ptitle{font-size:26px;font-weight:800;letter-spacing:-.5px;padding:8px 16px 4px}
/* сегменты */
.seg{display:flex;gap:4px;background:var(--gray);border-radius:10px;padding:3px;margin:10px 16px}
.seg button{flex:1;height:36px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink2)}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1)}
/* страница-оверлей */
.page{position:fixed;inset:0;z-index:50;background:#fff;overflow-y:auto;-webkit-overflow-scrolling:touch}
/* объявление */
.gal{position:relative;background:var(--gray)}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slides img{flex:0 0 100%;width:100%;aspect-ratio:4/3;object-fit:cover;scroll-snap-align:center;display:block}
.gnum{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px}
.gtop{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:calc(6px + env(safe-area-inset-top)) 6px 6px;background:linear-gradient(rgba(0,0,0,.28),transparent)}
.gtop .ibtn{color:#fff}
.gtop .ibtn.on svg{fill:var(--red);stroke:var(--red)}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 2px;scrollbar-width:none}.thumbs::-webkit-scrollbar{display:none}.thumbs img{flex:0 0 auto;width:56px;height:74px;border-radius:10px;object-fit:cover;border:2px solid transparent;opacity:.65;background:var(--gray);transition:.15s}.thumbs img.on{border-color:var(--blue);opacity:1}
.vlab{padding:10px 16px 0;font-size:14px;color:var(--mut)}.vlab b{color:var(--ink2)}.thumbs.vars img{width:64px;height:84px}.vblk{border:1px solid var(--gray);border-radius:14px;padding:10px;margin-bottom:10px}.vhd{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px;margin-bottom:8px}.vhd button{color:var(--red);font-size:13px}.addv{width:100%;padding:12px;border-radius:12px;border:1.5px dashed var(--blue);color:var(--blue-d);font-weight:600}
.ibody{padding:14px 16px 120px}
.iprice{font-size:26px;font-weight:800;letter-spacing:-.4px}
.ititle{font-size:18px;margin-top:4px;color:var(--ink2)}
.ibadge{display:inline-flex;align-items:center;gap:5px;margin-top:10px;background:#e5f6ff;color:#0077b3;font-size:13px;font-weight:600;padding:5px 10px;border-radius:8px}
.ibadge svg{width:15px;height:15px}
.ibadge.warn{background:#fff4e5;color:#a35b00}
.owner{display:flex;gap:8px;margin-top:14px}
.rst{color:#f5a623;font-weight:700}.rv{padding:10px 0;border-bottom:1px solid var(--gray2)}.rv small{color:var(--mut);margin-left:6px}.rvs{display:flex;gap:6px;font-size:34px;justify-content:center;margin:8px 0}.rvs b{cursor:pointer;color:#ccc}.rvs b.on{color:#f5a623}.ibadge.bad{background:#ffecec;color:#c0392b}.ibadge.good{background:#e8f8ee;color:#1e8e4f}
.owner .btn{flex:1;height:44px;font-size:14px;padding:0 10px}
.blk{margin-top:22px}
.istat{display:flex;align-items:center;gap:16px;color:var(--mut);font-size:14px;margin:4px 0 8px}.istat span{display:flex;align-items:center;gap:5px}.istat .i{width:18px;height:18px}.istat .r{margin-left:auto}
.ms .i{width:14px;height:14px;vertical-align:-2px}.anl{padding:4px 2px 10px}.anl h2{margin:0 0 12px}.atot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.atot div{background:rgba(127,127,127,.12);border-radius:14px;padding:10px;text-align:center}.atot b{display:block;font-size:20px}.atot small{color:var(--mut)}.arow{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid rgba(127,127,127,.18)}.arow img{width:52px;height:52px;border-radius:10px;object-fit:cover}.arow .t{flex:1;min-width:0}.arow .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}.arow .s{color:var(--mut);font-size:13px;display:flex;gap:10px}.spark{display:flex;align-items:flex-end;gap:2px;height:28px;margin-top:4px}.spark i{flex:1;background:#00aaff;border-radius:2px;min-height:2px;opacity:.8}
.blk h3{font-size:20px;font-weight:800;margin-bottom:10px;letter-spacing:-.3px}
.addr{display:flex;gap:10px;align-items:flex-start;color:var(--ink2)}
.addr svg{color:var(--mut);margin-top:1px}
.kv{display:flex;gap:6px;font-size:15px;padding:4px 0}
.kv span{color:var(--mut)}
.desc{white-space:pre-wrap;color:var(--ink2);font-size:15px;line-height:1.5}
.seller{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--gray2);cursor:pointer}
.av{width:48px;height:48px;border-radius:50%;background:#d9eefc;color:#0077b3;display:grid;place-items:center;font-weight:700;font-size:19px;flex:0 0 auto}
.seller .sn{flex:1;min-width:0;font-weight:700}
.seller .sn small{display:block;font-weight:400;color:var(--mut);font-size:13px;margin-top:1px}
.meta{font-size:13px;color:var(--mut);margin-top:22px;display:flex;flex-direction:column;gap:2px}
.abar{position:fixed;left:0;right:0;bottom:0;z-index:52;background:#fff;display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -1px 0 var(--line)}
.abar .btn{min-width:0;font-size:13px;flex:1;flex-direction:column;gap:0;height:52px;line-height:1.15}
.abar .btn small{font-size:11.5px;font-weight:400;opacity:.9}
.simgrid{margin:0 -16px}
/* форма */
.form{padding:0 16px 120px}
.fl{margin-top:22px}
.fl>label{display:block;font-size:15px;font-weight:700;margin-bottom:8px}
.fl>label i{font-style:normal;color:var(--mut);font-weight:400;font-size:13px}
.inp{width:100%;height:48px;border:0;border-radius:12px;background:var(--gray);padding:0 14px;font-size:16px;outline:0;transition:box-shadow .15s}
textarea.inp{height:auto;min-height:110px;padding:12px 14px;resize:vertical;line-height:1.45}
.inp:focus{box-shadow:inset 0 0 0 2px var(--blue);background:#fff}
.err .inp,.err .pgrid .add,.err .ccells{box-shadow:inset 0 0 0 2px var(--red)}
.ehint{display:none;color:var(--red);font-size:13px;margin-top:6px}
.err .ehint{display:block}
.row2{display:flex;gap:10px}.row2>div{flex:1}
.sub2{font-size:12.5px;color:var(--mut);margin-top:6px}
.ccells{display:flex;flex-direction:column;border-radius:12px;background:#fff}
.ccell{display:flex;align-items:center;gap:14px;width:100%;padding:12px 2px;font-size:16px;text-align:left;border-bottom:1px solid var(--line)}.ccell:last-child{border-bottom:0}.ccell .cl{flex:1}.ccell .rd{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px #c9c9c9;flex:0 0 auto}.ccell.on .rd{box-shadow:inset 0 0 0 7px var(--blue)}
.ccell svg{width:24px;height:24px;color:var(--ink2)}
.ccell.on{font-weight:600}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pgrid .add,.pgrid .th{aspect-ratio:1;border-radius:12px;position:relative;overflow:hidden}
.pgrid .add{background:var(--gray);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--blue-d);font-size:12px;font-weight:600}
.pgrid .th img{width:100%;height:100%;object-fit:cover}
.pgrid .th .x{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.pgrid .th .x svg{width:14px;height:14px;stroke-width:2.4}
.pgrid .th .cv{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;text-align:center;padding:2px}
.units{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.units .chip{padding:7px 12px;font-size:13px}
.check{display:flex;align-items:center;gap:12px;padding:12px 0;width:100%;text-align:left;font-size:15px}
.check .bx{width:22px;height:22px;border-radius:6px;box-shadow:inset 0 0 0 2px #c9c9c9;display:grid;place-items:center;flex:0 0 auto;color:#fff}
.check .bx svg{width:16px;height:16px;stroke-width:3;opacity:0}
.check.on .bx{background:var(--blue);box-shadow:none}
.check.on .bx svg{opacity:1}
.check small{display:block;color:var(--mut);font-size:12.5px}
.ffoot{position:fixed;left:0;right:0;bottom:0;z-index:52;background:#fff;padding:10px 16px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -1px 0 var(--line)}
.ffoot .btn{max-width:688px;margin:0 auto;display:flex}
/* мои объявления */
.mrow{display:flex;gap:12px;padding:12px 16px;cursor:pointer;align-items:flex-start}
.mrow+.mrow{border-top:1px solid var(--line)}
.mrow img{width:88px;height:88px;border-radius:10px;object-fit:cover;background:var(--gray);flex:0 0 auto}
.mrow .mi{flex:1;min-width:0}
.mrow .mt{font-size:15px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .mp{font-size:16px;font-weight:700;margin-top:2px}
.mrow .ms{font-size:13px;color:var(--mut);margin-top:4px}
.mrow .mtop{font-size:12.5px;color:#0077b3;font-weight:600;margin-top:4px;display:flex;align-items:center;gap:4px}
.mrow .mtop svg{width:14px;height:14px}
.mrow.arch img{opacity:.5}
/* профиль */
.pcard{display:flex;align-items:center;gap:14px;padding:12px 16px 4px}
.pcard .av{width:64px;height:64px;font-size:26px}
.pcard h2{font-size:22px;font-weight:800;letter-spacing:-.3px}
.pcard p{color:var(--mut);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 16px 4px}
.stat{background:var(--gray2);border-radius:12px;padding:12px;text-align:left}
.stat b{display:block;font-size:22px;font-weight:800}
.stat span{font-size:12.5px;color:var(--mut)}
.menu{margin-top:12px}
.mi2{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;text-align:left;font-size:16px}
.mi2 svg:first-child{color:var(--ink2)}
.mi2 .lt{flex:1}
.mi2 .lt small{display:block;color:var(--mut);font-size:13px}
.mi2 .rv{color:var(--mut);font-size:14px}
.mi2 .ch{color:#c4c4c4;width:20px;height:20px}
.mi2.danger,.mi2.danger svg:first-child{color:var(--red)}

    return true});

function pvZoom(s){var im=null,sc=1,x=0,y=0,d0=0,s0=1,px=0,py=0,lt=0,mv=0;

 s.addEventListener('touchstart',function(e){var t=e.touches,c=s.children[Math.round(s.scrollLeft/s.clientWidth)];if(c!==im){rs();im=c}mv=0;

 s.addEventListener('touchmove',function(e){var t=e.touches;mv=1;if(t.length===2&&d0){sc=Math.max(1,Math.min(5,s0*dist(t)/d0));ap();e.preventDefault()}else if(t.length===1&&sc>1){x+=t[0].clientX-px;y+=t[0].clientY-py;px=t[0].clientX;py=t[0].clientY;ap();e.preventDefault()}},{passive:false});

var TABS=['home','fav','my','msg','profile'];
function go(v){
  if(v==='sell'){location.hash='sell';return}
  var c=(location.hash||'#home').slice(1);
  if(c===v){window.scrollTo({top:0,behavior:motionScroll()});return}
  if(v==='home'){location.replace('#home');return}
  location.replace('#'+v);
}
window.go=go;
$('nav').addEventListener('click',function(e){var b=e.target.closest('button');if(b)go(b.dataset.v)});
function showTab(v){
  if(S.view!==v){S.view=v;TABS.forEach(function(t){$('v-'+t).hidden=t!==v});window.scrollTo(0,0)}
  document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)});
  if(v==='home')renderGrid();if(v==='fav')renderFav();if(v==='my')renderMy();if(v==='profile')renderProfile();if(v==='msg')renderChats();
}
function route(){
  var p=(location.hash||'#home').slice(1).split('/');
  if(p[0]==='search'){openSearch();return}
  if(!$('searchPg').hidden){sq.blur();$('searchPg').hidden=true}
  if(p[0]!=='filter'&&!$('modal').hidden)hideModal();
  $('pv').hidden=true;
  if(p[0]!=='item')$('itemPg').hidden=true;
  if(p[0]!=='sell'&&p[0]!=='edit')$('sellPg').hidden=true;
  if(p[0]!=='chat')$('chatPg').hidden=true;
  var over=p[0]==='item'||p[0]==='sell'||p[0]==='edit'||p[0]==='chat';
  document.body.style.overflow=over?'hidden':'';
  if(p[0]==='item'){renderItem(p[1]);return}
  if(p[0]==='sell'){openSell();return}
  if(p[0]==='edit'){openSell(p[1]);return}
  if(p[0]==='chat'){openChat(p[1]);return}
  if(p[0]==='filter'){showTab('home');openFilter();return}
  showTab(TABS.indexOf(p[0])>=0?p[0]:'home');
}
window.addEventListener('hashchange',route);

/* старт */
paintIcons();updNb();
if(!location.hash||location.hash==='#'||location.hash==='#filter')location.replace('#home');
route();
