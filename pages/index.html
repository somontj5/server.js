<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>СтеклоМаркет — объявление</title>
<style>body{font:16px system-ui;max-width:480px;margin:40px auto;padding:20px;color:#181818}a{display:block;padding:15px;background:#00aaff;color:white;text-align:center;text-decoration:none;border-radius:12px;margin-top:14px}#photo{width:100%;border-radius:16px}#desc{white-space:pre-wrap;color:#555}</style>
<h1>СтеклоМаркет</h1><p id="state">Откройте объявление в приложении</p><img id="photo" hidden alt="Фото товара"><h2 id="title"></h2><p id="price"></p><p id="desc"></p><a id="open" hidden>Открыть приложение</a><a href="https://github.com/somontj5/server.js/raw/main/apk/GlassMarket9.15.apk">Скачать APK 9.15</a>
<script>
(function(){var id=new URLSearchParams(location.search).get('listing');if(!id||!/^[A-Za-z0-9_-]{1,64}$/.test(id)){document.getElementById('state').textContent='В ссылке нет номера объявления';return}
var link='glassmarket://listing/'+encodeURIComponent(id),open=document.getElementById('open');open.href='intent://listing/'+encodeURIComponent(id)+'#Intent;scheme=glassmarket;package=ru.glassmarket.app;end';open.hidden=false;
if(/Android/i.test(navigator.userAgent))location.href=link;
fetch('https://raw.githubusercontent.com/somontj5/server.js/main/server-url.txt?t='+Date.now()).then(function(r){if(!r.ok)throw Error();return r.text()}).then(function(u){u=u.trim();if(!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(u))throw Error();return fetch(u+'/listings/'+encodeURIComponent(id))}).then(function(r){if(!r.ok)throw Error();return r.json()}).then(function(l){if(!l.id||l.archived)throw Error();document.getElementById('state').textContent='Объявление продавца';document.getElementById('title').textContent=l.name;document.getElementById('price').textContent=l.price;document.getElementById('desc').textContent=l.desc;var p=document.getElementById('photo');if(l.photos&&l.photos[0]){p.src=l.photos[0];p.hidden=false}}).catch(function(){document.getElementById('state').textContent='Сервер недоступен или объявление снято. Попробуйте открыть приложение.'})})();
</script></html>
